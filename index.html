<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Decodificador de texto</title>

    <meta
      name="description"
      content="Uma aplicação web simples e funcional que permite criptografar e descriptografar textos, desenvolvida como parte do desafio proposto pela Oracle e Alura."
    />
    <meta name="author" content="christianwl" />

    <link rel="stylesheet" href="./src/styles/style.css" />
  </head>

  <body>
    <header>
      <img
        class="logoAlura"
        src="./src/assets/img/logo/alura-logo.png"
        alt="Logo da alura"
      />
    </header>
    <main class="container">
      <section class="container__decodificador">
        <textarea
          id="text-area-cript"
          class="container__decodificador__input"
          cols="50"
          rows="10"
          placeholder="Digite seu texto aqui"
        ></textarea>
        <div class="container__decodificador__regra">
          <img
            src="./src/assets/img/icons/exclamation-circle-fill.png"
            alt="Simbolo de exclamação"
          />
          <p class="container__decodificador__regra__texto">
            Apenas letras minúsculas e sem acento
          </p>
        </div>
        <div class="container__decodificador__botoes">
          <button id="btn-encrypt" class="botao__cript">
            Criptografar
          </button>
          <button id="btn-decrypt" class="botao__descript" >
            Descriptografar
          </button>
        </div>
      </section>
      <aside class="container__areaCopia">
        <!-- <textarea class="mensagem" name="mensagem" id="" cols="20" rows="10"></textarea> -->
        <div class="container__areaCopia__conteudo">
          <div>
            <div id="copy-area">
              <img
                src="./src/assets/img/bg/figure.svg"
                alt="Imagem de uma moça com uma lupa"
              />
              <h1>Nenhuma mensagem encontrada</h1>
              <p>
                Digite um texto que você deseja criptografar ou descriptografar
              </p>
            </div>
            <p id="text-descript"></p>
            <button id="btn-copy" class="btn-copiar botao__descript" >
              Copiar
            </button>
          </div>
        </div>
      </aside>
    </main>
    <footer>
      <p>Desenvolvido por christianwl</p>
    </footer>
    <script src="./src/scripts/app.js" defer></script>
  </body>
</html>
